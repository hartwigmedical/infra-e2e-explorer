steps:
  - id: 'Set release version'
    name: 'node:24-alpine'
    entrypoint: 'npm'
    args: ['version', '${TAG_NAME}', '--no-git-tag-version', '--allow-same-version']

  - id: 'Publish e2e-explorer-server docker image'
    name: 'europe-west4-docker.pkg.dev/hmf-build/hmf-docker/docker-tag:2.0.0'
    args:
      - 'europe-west4-docker.pkg.dev/hmf-build/hmf-docker/e2e-explorer'
      - '$TAG_NAME'
      - 'Dockerfile.server'

logsBucket: 'gs://hmf-build-logs'
options:
  logging: GCS_ONLY
images:
  - europe-west4-docker.pkg.dev/hmf-build/hmf-docker/e2e-explorer
